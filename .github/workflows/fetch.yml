name: Fetch Ticket Tailor events

on:
  # Every 15 minutes.
  schedule:
    - cron: '*/15 * * * *'
  # Allow running manually from the Actions tab.
  workflow_dispatch: {}
  # Redeploy when the widget or fetch script changes.
  push:
    branches: [main]
    paths:
      - 'scripts/fetch.mjs'
      - '.github/workflows/fetch.yml'
      - 'embed/**'

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write  # keepalive step below

concurrency:
  group: tt-calendar-fetch
  cancel-in-progress: false

# Opt into the Node 24 runtime for JS-based actions ahead of the June 2026
# deprecation; silences the Node-20 warning without waiting for new action
# releases.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  fetch-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # GitHub silently disables a cron schedule after 60 days without a
      # commit to the repo (it bit us 2026-09-04 → 2026-10-02: the website
      # calendar froze for a month). Re-enabling the workflow through the API
      # counts as activity and resets that clock, with no dummy commits.
      - name: Keep the schedule alive
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/fetch.yml/enable"

      - name: Fetch events
        env:
          TT_API_KEY: ${{ secrets.TT_API_KEY }}
        run: node scripts/fetch.mjs

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: embed

      - id: deployment
        name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
